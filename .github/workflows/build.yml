name: Build APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Preparar chave de assinatura
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/hichord.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/hichord.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Secrets KEYSTORE_BASE64/KEYSTORE_PASSWORD nao configurados: o APK sai com chave temporaria e nao sera publicado."
          fi
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }
      - run: gradle assembleDebug --no-daemon -PverCode=${{ github.run_number }} -PrepoSlug=${{ github.repository }}
      - uses: actions/upload-artifact@v4
        with: { name: HiChord-apk, path: app/build/outputs/apk/debug/app-debug.apk }
      - name: Publicar release (usada pelo botao Atualizar do app)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$KS_B64" ]; then echo "Sem chave fixa, nao publico release."; exit 0; fi
          cp app/build/outputs/apk/debug/app-debug.apk HiChord.apk
          gh release create "v${{ github.run_number }}" HiChord.apk --title "HiChord ${{ github.run_number }}" --notes "Build automatico" --target "${{ github.sha }}"
